# =============================================================================
# 01 - Guardia basico
# -----------------------------------------------------------------------------
# El mob mas simple que sirve para algo. Lo que se aprende aqui:
#   categoria 'player', huevo, receta, atributos y ancla al dueno.
#
# Probar:   /customcore reload     y luego     /customcore give tutorial_guardia
# =============================================================================

id: tutorial_guardia

# 'player' = se invoca con un huevo y tiene DUENO: defiende a quien lo invoco.
# 'server' = sin dueno, vive en una faccion. Se ve en el ejemplo 03.
category: player

display-name: '&bGuardia'
type: ZOMBIE

# Material del huevo que se usa como ingrediente de la receta.
egg: ZOMBIE_SPAWN_EGG

# La receta por defecto es huevo + diamante. Aqui se cambia para no chocar con
# otro mob: dos recetas con los mismos ingredientes son indistinguibles en el
# cliente, y el segundo se omite con un aviso en el log.
recipe:
  extras:
    - IRON_INGOT
  # Cuantos huevos produce. 0 desactiva el crafteo (solo /customcore give).
  amount: 1

glow: false

# Claves amistosas; se traducen a los atributos de Bukkit.
attributes:
  health: 40.0
  damage: 5.0
  speed: 0.25
  follow-range: 24.0

# Ancla: 'owner' lo mantiene pegado a su dueno; 'point' lo deja fijo al bloque.
leash:
  anchor: owner
  max-distance: 10.0
  teleport-distance: 24.0

lore:
  - '&7Guardia invocado con un huevo custom.'
  - '&7Sigue a su dueno y lo protege.'
