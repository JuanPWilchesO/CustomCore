# =============================================================================
# 05 - Mercader figurante
# -----------------------------------------------------------------------------
# Lo que se aprende aqui: 'ai: false' para dejarlo QUIETO en su puesto, mas
# disfraz y sonidos.
#
# Se invoca con:   /customcore spawn tutorial_mercader
# =============================================================================

id: tutorial_mercader
category: server
display-name: '&6Mercader'
type: VILLAGER

# Neutral: no ataca jugadores salvo que lo agredan. Para un figurante que no
# debe meterse en peleas, 'neutral' o 'defender' son las opciones sensatas.
attitude: neutral

# 'false' deja al mob completamente quieto, sin deambular. Es lo que quieres
# para un vendedor, un cartel o un figurante de escena.
ai: false

glow: false
burn-in-daylight: false

attributes:
  health: 20.0
  damage: 0.0

# Apariencia via LibsDisguises. Si el plugin no esta instalado, esta seccion se
# ignora sin errores: el mob aparece con su forma normal.
disguise:
  enabled: true
  type: player
  # Nombre de un jugador real, para copiar su skin.
  skin: NombreDeJugador
  show-name: true

# Cualquier seccion de sonido puede omitirse.
sounds:
  ambient:
    sound: entity.villager.ambient
    volume: 1.0
    pitch: 1.0
    interval-seconds: 12
  hurt:
    sound: entity.villager.hurt
    volume: 1.0
    pitch: 1.0

leash:
  max-distance: 0.0

lore:
  - '&7Figurante quieto en su puesto.'
  - '&7No deambula: ai esta en false.'
