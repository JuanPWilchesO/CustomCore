name: CustomCore
version: '${project.version}'
main: com.juanp.custommobs.CustomMobsPlugin
api-version: '1.21'
author: Juan Pablo
description: Mobs, objetos, recetas, facciones y pociones custom definidos por YAML.
website: https://github.com/JuanPWilchesO/CustomMobs

softdepend:
  - Teams
  - LibsDisguises
  - LuckPerms
  - WorldGuard

commands:
  customcore:
    description: Administracion de CustomCore.
    usage: /customcore <reload|list|give|spawn|cuota>
    aliases: [cm, cmobs, custommobs]
    # Sin 'permission' aqui a proposito: el permiso se comprueba en el codigo, por
    # subcomando, para que un jugador raso pueda usar 'cuota' y ver su propio cupo.

permissions:
  custommobs.player:
    description: Permite invocar mobs con los huevos custom.
    default: true
  custommobs.admin:
    description: Acceso a los comandos de administracion de CustomMobs.
    default: op
