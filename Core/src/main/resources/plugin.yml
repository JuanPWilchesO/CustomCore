name: CustomCore
version: '${project.version}'
main: com.juanp.custommobs.CustomMobsPlugin
api-version: '26.3'
author: Juan Pablo
description: Mobs, objetos, recetas, facciones y pociones custom definidos por YAML.
website: https://github.com/JuanPWilchesO/CustomCore

softdepend:
  - Teams
  - LibsDisguises
  # Modelos 3D (modo Bedrock) para los mobs. Sin el, los mobs se ven con su forma vanilla.
  - BetterModel
  - LuckPerms
  - WorldGuard
  # Necesario para el filtro de metadatos/equipo del sigilo (y para el brillo de facciones).
  - packetevents

commands:
  customcore:
    description: Administracion de CustomCore.
    usage: /customcore <reload|list|give|spawn|cuota>
    aliases: [cm]
    # Sin 'permission' aqui a proposito: el permiso se comprueba en el codigo, por
    # subcomando, para que un jugador raso pueda usar 'cuota' y ver su propio cupo.

permissions:
  customcore.player:
    description: Permite invocar mobs con los huevos custom.
    default: true
  customcore.admin:
    description: Acceso a los comandos de administracion de CustomCore.
    default: op
  customcore.bypass:
    description: Permite saltarse las restricciones de faccion y clase de objetos y pociones.
    default: op
