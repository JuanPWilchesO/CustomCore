# CustomMobs - configuracion general
debug: false

# ---------------------------------------------------------------------------
# Firma y mensaje de bienvenida.
# ---------------------------------------------------------------------------
branding:
  # La firma del log esta hardcodeada en el codigo, con los colores de la bandera
  # palestina: no se configura desde aqui.

  # Mensaje que ve el jugador al entrar. Admite '&' para color.
  # Marcadores disponibles: {jugador}, {online}, {max}
  # Por defecto en rojo y negro; cambia los '&' a gusto.
  # Para desactivarlo: motd-enabled en false, o la lista vacia.
  motd-enabled: true
  motd:
    - '&0&m----------------------------------'
    - ' &cCustomMobs &0| &cAP2P Project'
    - ' &cBienvenido, &4{jugador}&c.'
    - '&0&m----------------------------------'

targeting:
  # Radio en bloques para buscar objetivos alrededor del soldado.
  radius: 16.0
  # Cada cuantos ticks se revisan los objetivos (20 ticks = 1 segundo).
  interval-ticks: 20

  # ---------------------------------------------------------------------------
  # Politica de ataque contra JUGADORES (los monstruos hostiles se atacan igual).
  # Cada mob puede sobrescribirla en su propio yml con:
  #     targets:
  #       players: <modo>
  #
  #   never       -> nunca ataca jugadores. Mob de apoyo puramente PvE.
  #   enemies     -> solo si Teams los marca como enemigos.
  #                  OJO: Teams 1.0.2 nunca llena esa lista, hoy equivale a never.
  #   non-allies  -> ataca a todo jugador que no sea de su team ni aliado.
  #   defensive   -> neutral por defecto; se vuelve hostil contra quien agreda a
  #                  su bando (dueno, companeros, aliados, o mobs de ellos).
  # ---------------------------------------------------------------------------
  player-mode: defensive

  # Solo para 'defensive': cuanto dura la hostilidad ganada por agresion.
  aggro-duration-seconds: 120
  # Radio en bloques en el que un mob percibe agresiones contra su bando.
  aggro-watch-radius: 24.0
  # Si tambien reacciona cuando el agredido es un mob del mismo bando.
  aggro-on-friendly-mobs: true

# El huevo NO se consume: es la ficha del mob, sirve para recogerlo y re-colocarlo.

skills:
  # Cada cuantos ticks se evaluan las skills de cada mob (20 ticks = 1 segundo).
  interval-ticks: 20

permissions:
  # Permiso para usar los huevos custom. Se comprueba con el sistema de permisos de
  # Bukkit, asi que sirve cualquier plugin (LuckPerms incluido).
  player: custommobs.player
  # Permiso para los comandos de administracion.
  admin: custommobs.admin

limits:
  # Cupo de mobs anclados al DUENO (anchor: owner) para quien no tenga grupo mapeado.
  # Al alcanzarlo, sus huevos dejan de invocar. 0 = sin limite.
  default-player-mobs: 3
  # Cupo de mobs anclados a un BLOQUE (anchor: point). Es una cuenta APARTE de la de
  # arriba: un jugador puede tener su cupo lleno de mobs que siguen y, ademas, los
  # mobs fijos que le permita este otro. 0 = sin limite.
  default-point-mobs: 1
  # Cupo por grupo de LuckPerms (mobs anclados al dueno). Si el jugador pertenece a
  # varios grupos gana el cupo mas alto. Sin LuckPerms, todos caen en el default.
  groups:
    default: 3
    vip: 5
    staff: 10
  # Cupo por grupo para los mobs anclados a un bloque. Mismas reglas que arriba.
  point-groups:
    default: 1
    vip: 2
    staff: 3
  # Cupo de MONTURAS. Tercera cuenta, tambien aparte de las dos anteriores.
  default-mount-mobs: 1
  # Cupo por grupo para las monturas. Mismas reglas que arriba.
  mount-groups:
    default: 1
    vip: 2
    staff: 3

point:
  # Radio en chunks que se mantiene cargado alrededor del bloque de un mob anclado a
  # un punto, para que no desaparezca ni deje de contar aunque no haya jugadores
  # cerca. OJO: es un cuadrado de (2*radio+1)^2 chunks; con el valor 4 son 81 chunks
  # por mob. 0 = desactivado.
  chunk-radius: 4

spawning:
  # Aparicion aleatoria de los mobs de servidor que la pidan en su yml con 'spawn.natural'.
  # OJO: esto es aparte de los spawners. Un spawner es un punto fijo que reaparece; esto
  # son mobs que brotan al azar, de una sola vida y sin persistir. No los toca ni los
  # sustituye: solo suma.
  enabled: true
  # Cada cuantos segundos se intenta.
  interval-seconds: 10
  # Intentos por jugador y ciclo.
  attempts: 2
  # Tope de mobs naturales vivos a la vez en todo el servidor.
  global-cap: 80

book:
  # Libro de inspeccion: muestra al jugador SUS mobs con sus estadisticas de combate.
  # Solo lo reparte un administrador (/custommobs book), pero cualquier jugador puede
  # usarlo, para que el servidor lo venda o lo regale desde su economia.
  material: WRITTEN_BOOK
  display-name: '&6Inventario de fuerzas'
  lore:
    - '&7Muestra tus mobs y sus estadisticas.'
    - '&7Clic derecho para abrirlo.'

worlds:
  # Mundos donde funciona el plugin. Vacio = todos.
  # Los nombres son los de Bukkit, asi que sirve cualquiera, incluidos los de
  # Multiverse-Core (mira el nombre exacto con /mv list).
  enabled: []

recall:
  # Ventana de abandono: que pasa cuando dejas atras un mob anclado a ti.
  # Si el mob no puede volver a tu lado (estas en otro mundo no habilitado, o
  # demasiado lejos), se le da un plazo antes de retirarlo.
  enabled: true
  # Radio en bloques a partir del cual el mob cuenta como abandonado.
  # 0 = derivado de la simulation-distance del mundo (recomendado).
  radius: 0.0
  # Segundos que se espera antes de destruir el mob abandonado.
  mob-seconds: 60
  # Segundos que se mantiene cargado su chunk antes de soltarlo.
  # Nunca puede ser menor que mob-seconds.
  chunk-seconds: 120

faction-glow:
  # Brillo de los jugadores segun su faccion, PARA CADA QUIEN: el color de un brillo sale del
  # equipo de scoreboard, y los equipos son globales, asi que se le manda a cada jugador un
  # equipo falso. No se toca el scoreboard de verdad: no rompe Teams ni ningun otro plugin.
  #
  #   off    -> nadie ve el brillo
  #   global -> lo ven todos, siempre
  #   player -> cada jugador lo decide con /custommobs glowfaccion
  mode: off
  # Radio en bloques dentro del cual se pinta. 0 = sin limite.
  radius: 48.0
  # Colores por relacion (los nombres de color de Minecraft).
  enemy: RED
  ally: GREEN
  neutral: GRAY

teams:
  # Que hacer cuando un jugador entra en una faccion: si esta en un team cuyo jefe es de OTRA
  # faccion, el team deja de ser consecuente con las reglas, asi que sale de el.
  # La API de Teams solo deja LEER, asi que la salida se hace con su comando: pon aqui el que
  # sea exacto en tu servidor ({jugador} se sustituye por el nombre).
  kick-command: 'team kick {jugador}'
  # Si el jefe del team no tiene faccion, no se saca a nadie.
  kick-if-owner-factionless: false
  # Y al entrar: si el jefe del team no tiene faccion, se deja entrar a cualquiera.
  # En true, no deja entrar a quien tenga faccion.
  block-join-if-owner-factionless: false
